schema_version: 2
id: cancel-renewal-refund
risk: high
prompt: I forgot to cancel and renewed yesterday. Am I automatically entitled to a
  refund?
intent: Do not misclassify an ordinary renewal as duplicate charge.
dependencies:
- cancellation-policy#subscription
- cancellation-policy#duplicate-charge
expected_facts:
- Already billed fees are non-refundable absent the duplicate-charge exception.
- Forgetting to cancel is not a duplicate charge.
required_citations: []
assertions:
- id: structured-output
  category: format
  description: Response is valid bounded structured JSON with exact target identity.
  evaluator_version: structured-v2
- id: answer-correct
  category: correctness
  description: The answer satisfies every authored expected fact without unsupported
    eligibility or guarantees.
  evaluator_version: rubric-v1
- id: current-citation
  category: citation
  description: Citations identify relevant sections in the requested context snapshot.
  evaluator_version: citation-v1
- id: no-contradiction
  category: grounding
  description: Policy claims are supported by cited source text and do not contradict
    applicable exceptions.
  evaluator_version: rubric-v1
smoke: false
