schema_version: 2
id: cancel-access
risk: high
prompt: If I cancel my subscription today, will access stop immediately?
intent: Separate cancellation from access termination.
dependencies:
- cancellation-policy#subscription
expected_facts:
- Access continues until the end of the current paid period; next renewal is prevented.
