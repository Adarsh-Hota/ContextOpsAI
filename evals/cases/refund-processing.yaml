schema_version: 2
id: refund-processing
risk: medium
prompt: I submitted a refund request today. When will the money arrive?
intent: Distinguish submission from approval and business-day processing.
dependencies:
- refund-policy#processing
expected_facts:
- Approved refunds take 5 to 10 business days to the original payment method.
- Submission does not imply approval or an exact arrival date.
required_citations: []
assertions:
- id: structured-output
  category: format
  description: Response is valid bounded structured JSON with exact target identity.
  evaluator_version: structured-v2
- id: answer-correct
  category: correctness
  description: The answer satisfies every authored expected fact without unsupported
    eligibility or guarantees.
  evaluator_version: rubric-v1
- id: current-citation
  category: citation
  description: Citations identify relevant sections in the requested context snapshot.
  evaluator_version: citation-v1
- id: no-contradiction
  category: grounding
  description: Policy claims are supported by cited source text and do not contradict
    applicable exceptions.
  evaluator_version: rubric-v1
smoke: false
